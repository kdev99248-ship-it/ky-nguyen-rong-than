# cdn/www — GM panel, login, CDN resource client.
# Thay Apache 2.4 (cdn/apache/conf/httpd.conf + vhosts.conf) trên Windows.
#
# Cổng 81 là cổng chính. Thêm 88 vì vhosts.conf của Apache có <VirtualHost *:88>
# cùng DocumentRoot — giữ lại cho khỏi chết link cũ. VirtualHost _default_:80 trong
# file đó chưa bao giờ hoạt động (Apache chỉ Listen 81, cổng 80 là của Tomcat).

server {
    listen      81;
    listen      88;
    server_name _;

    # Phải trùng đúng đường dẫn mount của container php, xem docker-compose.yml.
    root  /opt/knrt/cdn/www;
    index index.html index.htm index.php l.php;

    charset utf-8;

    # Khớp client_max_body_size trong cdn/nginx/conf/nginx.conf cũ.
    client_max_body_size 100m;

    access_log /var/log/nginx/knrt.access.log;
    error_log  /var/log/nginx/knrt.error.log;

    location / {
        autoindex off;
        try_files $uri $uri/ =404;
    }

    # Apache dùng <FilesMatch "\.php$"> nên chỉ .php cuối URL mới chạy PHP —
    # giữ đúng như vậy, không bắt PATH_INFO như nginx.conf cũ.
    # Lưu ý serverlist.php là JSON thuần, không có thẻ <?php: đi qua php-fpm
    # và được in nguyên văn, đúng như trên Windows.
    location ~ \.php$ {
        try_files      $uri =404;
        fastcgi_pass   127.0.0.1:9100;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # gm/item.txt là dữ liệu của form, vẫn phải đọc được. Chỉ chặn file ẩn.
    location ~ /\. {
        deny all;
    }
}
