; Các mục lấy từ cdn/php/php.ini của Windows còn ý nghĩa trên Linux.
; extension_dir và session.save_path bỏ đi — image tự quản.

short_open_tag = Off

; php.ini Windows để trống date.timezone; PHP 7 cảnh báo nếu thiếu.
; gm/config.php vẫn tự gọi date_default_timezone_set("PRC") đè lên mục này.
date.timezone = Asia/Ho_Chi_Minh

; cdn/www/7ball/versionZip phục vụ gói cập nhật resource client.
upload_max_filesize = 100M
post_max_size       = 100M
