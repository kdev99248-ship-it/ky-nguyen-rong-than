[www]
; 9100 chứ KHÔNG phải 9000: cdn/nginx/conf/nginx.conf cũ để fastcgi_pass 127.0.0.1:9000,
; trùng đúng cổng UserCenter (README.md đã ghi nhận lỗi này ở mục "Việc còn lại").
; Mọi container dùng network_mode: host nên cổng nằm chung một không gian với host.
listen = 127.0.0.1:9100

; Chỉ nghe loopback -> nginx nối được, ngoài Internet thì không.
listen.allowed_clients = 127.0.0.1

; Bản Windows chạy mod_php trong Apache nên không có khái niệm process manager.
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Đẩy lỗi PHP ra stderr để xem bằng: ./knrt.sh logs php
catch_workers_output = yes
decorate_workers_output = no
