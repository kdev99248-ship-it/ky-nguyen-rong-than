<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Pika Pika - Web SHOP</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/dataTables.bootstrap4.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/dataTables.bootstrap4.min.js"></script>
    <script th:src="@{/js/ctxd.js}"></script>
    <style type="text/css">
        body {
            background: #eee
        }

        .ratings i {
            color: green
        }

        .install span {
            font-size: 12px
        }

        .col-md-4 {
            margin-top: 27px
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header menu -->
    <div class="bs-example" th:fragment="header">
        <nav class="navbar navbar-expand-md navbar-light bg-light">
            <a th:href="@{/index}" class="navbar-brand">Pika</a>
            <button type="button" class="navbar-toggler" data-toggle="collapse"
                    data-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav">
                    <a th:href="@{/home}" class="nav-item nav-link">Home</a>
                    <a th:href="@{/charge}" class="nav-item nav-link">Nạp thẻ</a>
                    <a th:href="@{/buy-package}" class="nav-item nav-link">Mua gói</a>
                    <a th:href="@{/gift-code}" class="nav-item nav-link">Gift Code</a>
                    <a th:href="@{/webshop}" class="nav-item nav-link active">WebShop</a>
                    <a th:href="@{/lucky-draw}" class="nav-item nav-link">Vòng quay</a>
                    <a th:href="@{/event}" class="nav-item nav-link">Sự kiện</a>
                </div>
                <div class="navbar-nav ml-auto">
                    <div class="nav-item nav-link header-name"></div>
                    <a th:href="@{/log-out}" class="nav-item nav-link">Thoát</a>
                </div>
            </div>
        </nav>
    </div>
    <!-- End Header menu -->
    <hr/>
    <h4>Lấy ID ở gần avatar, WEBSHOP nơi bạn có thể mua các vật phẩm trân quý</h4>
    <form class="row">
        <div class="form-group col-md-3">
            <label for="serverId">Chọn server:</label>
            <select class="form-control" id="serverId">
                <option value="0">--</option>
                <option th:each="item: ${servers}" th:value="${item.id}" th:utext="|${item.nameServer}|"></option>
            </select>
        </div>
        <div class="form-group col-md-3">
            <label for="typePoint">Loại tiền tệ:</label>
            <select class="form-control" id="typePoint">
                <option value="0">Xu không khóa</option>
                <option value="1">Xu khóa</option>
            </select>
        </div>
        <div class="form-group col-md-3">
            <label for="playerName">ID game: </label>
            <input type="text" class="form-control" id="playerName" aria-describedby="playerName"
                   placeholder="Nhập ID trong game" required>
        </div>
        <div class="form-group col-md-3">
            <label for="playerName">Lấy ID cho user hiện tại:</label>
            <button type="button" class="btn btn-primary" id="getPlayerId">Lấy ngay</button>
        </div>
    </form>
    <div class="row" id="data">
        <div class="col-md-4">
            <div class="card p-3">
                <div class="d-flex flex-row mb-3">
                    <img src="https://i.imgur.com/ccMhxvC.png" width="70">
                    <div class="d-flex flex-column ml-2">
                        <span>Đá Huyền Thoại</span>
                        <span class="text-black-50">S.lượng: 5</span>
                        <span class="ratings">Giá: <b style="color: red">10.000 Xu<del>(50.000 Xu)</del></b></span>
                    </div>
                </div>
                <h6>Đá năng lượng để nâng cấp PET</h6>
                <div class="d-flex justify-content-between install mt-3">
                    <span>Đã mua: 10 lượt</span>
                    <span class="text-primary">
                        <button type="button" class="btn btn-primary" id="buyItem">Mua</button>
                    </span>
                </div>
            </div>
        </div>

    </div>
</div>
</body>

<script>
    $(document).ready(function () {
        $.ajax({
            url: "/api/web-shop/all",
            type: "GET",
            dataType: 'json',
            contentType: "application/json",
            success: function (response) {
                let html = "";
                $.each(response.data, function (index, value) {
                    html += "<div class=\"col-md-4\">\n" +
                        "            <div class=\"card p-3\">\n" +
                        "                <div class=\"d-flex flex-row mb-3\">\n" +
                        "                    <img src=\"" + value.imgUrl + "\" width=\"70\">\n" +
                        "                    <div class=\"d-flex flex-column ml-2\">\n" +
                        "                        <span>" + value.name + "</span>\n" +
                        "                        <span class=\"text-black-50\">Mua tối đa: " + value.quantity + " lượt/ngày</span>\n" +
                        "                        <span class=\"ratings\">Giá: <b style=\"color: red\">" + value.price + " Xu<del>(" + value.oldPrice + " Xu)</del></b></span>\n" +
                        "                    </div>\n" +
                        "                </div>\n" +
                        "                <h6>" + value.description + "</h6>\n" +
                        "                <div class=\"d-flex justify-content-between install mt-3\">\n" +
                        "                    <span>Tổng đã mua: " + value.sold + " lượt</span>\n" +
                        "                    <span class=\"text-primary\">\n" +
                        "                        <button type=\"button\" class=\"btn btn-primary\" data-itemId=" + value.id + " onclick='buyItem(event)'>Mua</button>\n" +
                        "                    </span>\n" +
                        "                </div>\n" +
                        "            </div>\n" +
                        "        </div>";
                });
                $("#data").html(html);

            }
        });
    })

    function buyItem(event) {
        let itemId = event.target.dataset.itemid;
        var playerName = $("#playerName").val();
        var serverId = $("#serverId").val();
        var typePoint = $("#typePoint").val();
        if (playerName == null || playerName.trim() == "") {
            alert("Vui lòng nhập id nhân vật!");
            return;
        }
        if (serverId == 0) {
            alert("Chọn server trước!");
            return;
        }
        var dataCharge = {idInGame: playerName, itemId: itemId, idServer: serverId, typePoint: typePoint};
        $.ajax({
            url: "/api/web-shop/buy",
            type: "POST",
            dataType: 'json', headers: {
                'Authorization': sessionStorage.getItem("token"),
            },
            contentType: "application/json",
            data: JSON.stringify(dataCharge),
            success: function (response) {
                alert(response.msg);
                window.location.href = "/webshop";
            },
            error: function (jqXHR) {
                alert("Có lỗi xảy ra: " + jqXHR.responseJSON.msg);
            }
        });
    }
</script>
</html>
