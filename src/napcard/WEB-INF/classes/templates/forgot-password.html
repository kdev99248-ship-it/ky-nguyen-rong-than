<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pika Pika - Quên mật khẩu</title>
    <link
            href="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
            rel="stylesheet" id="bootstrap-css">
    <script
            src="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script
            src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link th:href="@{/css/style-login.css}" rel="stylesheet" />
</head>
</body>
<div class="wrapper fadeInDown">
    <div id="formContent">
        <!-- Tabs Titles -->

        <!-- Icon -->
        <div class="fadeIn first">
            <img th:src="@{/images/logo.png}" id="icon" alt="User Icon" />
        </div>
        <h3>Quên mật khẩu</h3>
        <hr />
        <!-- Login Form -->
        <form>
            <input type="text" id="email" class="fadeIn third" name="email"
                   placeholder="Nhập email để lấy lại mật khẩu"> <input
                type="submit" class="fadeIn fourth" value="Lấy mật khẩu">
        </form>

        <!-- Remind Passowrd -->
        <div id="formFooter">
            <a class="underlineHover" th:href="@{/register}">Đăng ký tài
                khoản?</a> | <a class="underlineHover" th:href="@{/login}">Đăng nhập
            ngay</a>
        </div>

    </div>
</div>
</body>
</html>
