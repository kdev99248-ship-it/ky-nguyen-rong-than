<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
            integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
            integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
            crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
            integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
            crossorigin="anonymous"></script>
    <link rel='stylesheet' href='https://use.fontawesome.com/releases/v5.5.0/css/all.css'
          integrity='sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU' crossorigin='anonymous'>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="icon" href="./favicon.ico" sizes="32x32">
    <link rel="icon" href="./favicon.ico" sizes="192x192">
    <title>Phần dành cho GM - Add point cho user</title>
</head>
<body>
<div class="container">

    <h3>Phần này dành cho admin, hãy cẩn thận trong việc sử dụng nó</h3>
    <hr/>
    <div th:if="${message}">
        <p class="alert alert-info" role="alert" th:text="${message}"></p>
    </div>
    <!--Form-->
    <form th:action="@{/admin/nap}" th:object="${requestDto}" method="post">
        <div class="form-group">
            <label for="gm-code">Mã GM:</label>
            <input type="text" class="form-control" id="gm-code" th:field="*{gmCode}" required/>
        </div>
        <div class="form-group">
            <label for="username">Tài khoản:</label>
            <input type="text" class="form-control" id="username" th:field="*{userName}" required/>
        </div>
        <div class="check-user">
            <button type="button" class="btn btn-primary" id="btn-check">Kiểm tra</button>
        </div>
        <div class="form-group">
            <label for="coin">Số tiền thêm:(100000; 200000)</label>
            <input type="text" class="form-control" id="coin" th:field="*{point}" required/>
        </div>
        <div class="form-group">
            <label for="bonus">Bonus như nào: (1; 1.5; 2; ...)</label>
            <input type="text" class="form-control" id="bonus" th:field="*{bonus}" required/>
        </div>
        <button class="btn btn-danger" th:type="submit"id="btn-submit">Nạp tiền</button>
        <button class="btn btn-danger" th:type="button" id="btn-reset">Reset</button>
        <span>Chú ý kiểm tra kĩ thông tin trước khi nhấn nút này</span>
    </form>
</div>
</body>

<script>
    $(document).ready(function() {

        $("#btn-check").click(function() {
            checkAccount();
        });

        function checkAccount() {
            var userName = $("#username").val();
            $.ajax({
                url: '/api/user/check-user/' + userName,
                type: 'get',
                success: function (data, status) {
                    alert("Tài khoản này hợp lệ, số tiền có: " + data.data);
                }, error: function (data, status) {
                    alert("Lỗi: " + data.responseJSON.msg);
                },
            });
        };

        $("#btn-reset").click(function() {
            resetData();
        });

        function resetData() {
            $("#gm-code").val("");
            $("#username").val("");
            $("#coin").val("");
            $("#bonus").val("");
        }
    });
</script>
</html>
