<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Pika Pika - Vòng quay</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/dataTables.bootstrap4.min.css">
    <link rel="stylesheet" href="css/typo/typo.css"/>
    <link rel="stylesheet" href="css/hc-canvas-luckwheel.css"/>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/dataTables.bootstrap4.min.js"></script>
    <script th:src="@{/js/ctxd.js}"></script>
    <style>
        body {
			background-repeat: no-repeat;
			max-width: 100%;
			width: 100%;
        }
    </style>
    <style>

        .hc-luckywheel {
            position: fixed;
            top: 55%;
            left: 50%;
            margin-top: -250px;
            margin-left: -250px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header menu -->
    <div class="bs-example">
        <nav class="navbar navbar-expand-md navbar-light bg-light">
            <a th:href="@{/index}" class="navbar-brand">Pika</a>
            <button type="button" class="navbar-toggler" data-toggle="collapse"
                    data-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav">
                    <a th:href="@{/home}" class="nav-item nav-link">Home</a>
                    <a th:href="@{/charge}" class="nav-item nav-link">Nạp thẻ</a>
                    <a th:href="@{/buy-package}" class="nav-item nav-link">Mua gói</a>
                    <a th:href="@{/gift-code}" class="nav-item nav-link">Gift Code</a>
                    <a th:href="@{/webshop}" class="nav-item nav-link">WebShop</a>
                    <a th:href="@{/lucky-draw}" class="nav-item nav-link">Vòng quay</a>
                    <a th:href="@{/event}" class="nav-item nav-link">Sự kiện</a>
                </div>
                <div class="navbar-nav ml-auto">
                    <div class="nav-item nav-link header-name"></div>
                    <a th:href="@{/log-out}" class="nav-item nav-link">Thoát</a>
                </div>
            </div>
        </nav>
    </div>
    <!-- End Header menu -->
    <div class="wrapper typo" id="wrapper">
        <div>Số lượt còn lại: <a href="#" id="turnRound">0</a> lượt</div>
        <section id="luckywheel" class="hc-luckywheel">
            <div class="hc-luckywheel-container">
                <canvas class="hc-luckywheel-canvas" width="500px" height="500px"
                >Vòng Xoay May Mắn
                </canvas
                >
            </div>
            <a class="hc-luckywheel-btn" href="javascript:;">Xoay</a>
        </section>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
<script src="js/hc-canvas-luckwheel.js"></script>
<script>
    var isPercentage = true;
    var prizes = [
        {
            text: "100.000 Xu",
            img: "images/100.png",
        },
        {
            text: "50.000 Xu",
            img: "images/10.png",
        },
        {
            text: "20.000 Xu",
            img: "images/20.png",
        },
        {
            text: "10.000 Xu",
            img: "images/50.png",
        },
        {
            text: "Chúc bạn may mắn lần sau",
            img: "images/miss.png",
        },
    ];
    document.addEventListener(
        "DOMContentLoaded",
        function () {
            hcLuckywheel.init({
                id: "luckywheel",
                config: function (callback) {
                    callback &&
                    callback(prizes);
                },
                mode: "both",
                getPrize: function (callback) {
                    let turnRound = parseInt($("#turnRound").text());
                    if(turnRound <= 0) {
                        alert("Lượt quay không đủ, quay lại vào ngày mai, hoặc nạp tiền để nhận lượt");
                        return;
                    }
                    let rand = randomIndex(callback);
                },
                gotBack: function (data) {
                    if (data == null) {
                        Swal.fire(
                            'Chương trình kết thúc',
                            'Đã hết phần thưởng',
                            'error'
                        )
                    } else if (data == 'Chúc bạn may mắn lần sau') {
                        Swal.fire(
                            'Bạn không trúng thưởng',
                            data,
                            'error'
                        )
                    } else {
                        Swal.fire(
                            'Đã trúng giải',
                            data,
                            'success'
                        )
                    }
                }
            });
        },
        false
    );

    async function randomIndex(callback) {
        // mockup data
        // return 4;
        $.ajax({
            url:  "/api/user/lucky-draw/prize",
            type: "GET",
            dataType: 'json',
            headers: {
                'Authorization': sessionStorage.getItem("token"),
            },
            contentType: "application/json",
            success: function (response) {
                let rand = response.data.prize;
                let chances = rand;
                callback && callback([rand, chances]);
                $("#turnRound").html( response.data.turn);
            },
            error: function(jqXHR) {
                alert("Có lỗi xảy ra: "+ jqXHR.responseJSON.msg);
            }
        });

    }

</script>
</body>
</html>
