<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Pika Pika - Trang Chủ</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/dataTables.bootstrap4.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/dataTables.bootstrap4.min.js"></script>
    <script th:src="@{/js/ctxd.js}"></script>
    <style>
        .toast {
            max-width: 100%;
        }

        /*body {*/
        /*    background-image:  url("/images/background.jpg");*/
        /*}*/
    </style>
</head>
<body>
<div class="container">
    <!-- Header menu -->
    <div class="bs-example">
        <nav class="navbar navbar-expand-md navbar-light bg-light">
            <a th:href="@{/index}" class="navbar-brand">Pika</a>
            <button type="button" class="navbar-toggler" data-toggle="collapse"
                    data-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav">
                    <a th:href="@{/home}" class="nav-item nav-link active">Home</a>
                    <a th:href="@{/charge}" class="nav-item nav-link">Nạp thẻ</a>
                    <a th:href="@{/buy-package}" class="nav-item nav-link">Mua gói</a>
                    <a th:href="@{/gift-code}" class="nav-item nav-link">Gift Code</a>
                    <a th:href="@{/webshop}" class="nav-item nav-link">WebShop</a>
                    <a th:href="@{/lucky-draw}" class="nav-item nav-link">Vòng quay</a>
                    <a th:href="@{/event}" class="nav-item nav-link">Sự kiện</a>
                </div>
                <div class="navbar-nav ml-auto">
                    <div class="nav-item nav-link header-name"></div>
                    <a th:href="@{/log-out}" class="nav-item nav-link">Thoát</a>
                </div>
            </div>
        </nav>
    </div>
    <!-- End Header menu -->
    <hr/>
    <div class="row">
        <div class="col-sm">
            <div class="alert alert-primary" role="alert" id="total-charge">
                Đã nạp vào hệ thống: 1.000.000 VNĐ
            </div>
        </div>
        <div class="col-sm">
            <div class="alert alert-warning" role="alert" id="amount">
                Số dư khả dụng: 200.000 VNĐ
            </div>
        </div>
    </div>
    <hr/>
    <h3>Quà hàng ngày</h3>
    <form>
        <div class="form-group">
            <label for="serverId">Chọn server:</label>
            <select class="form-control" id="serverId">
                <option value="0">--</option>
                <option th:each="item: ${servers}" th:value="${item.id}" th:utext="|${item.nameServer}|"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="playerName">ID game: </label>
            <input type="text" class="form-control" id="playerName" aria-describedby="playerName"
                   placeholder="Nhập ID trong game" required>
        </div>
        <button type="button" class="btn btn-primary" id="getGiftDaily">Lấy quà hàng ngày</button>
        <button type="button" class="btn btn-primary" id="getPlayerId">Lấy ID hiện tại</button>
    </form>
    <hr>
    <h3>Đổi mật khẩu:</h3>
    <form>
        <div class="form-group">
            <label for="newPass">Mật khẩu mới:</label>
            <input type="text" class="form-control" id="newPass" aria-describedby="newPass"
                   placeholder="Nhập mật khẩu mới" required>
        </div>
        <div class="form-group">
            <label for="reNewPass">ID game: </label>
            <input type="text" class="form-control" id="reNewPass" aria-describedby="reNewPass"
                   placeholder="Nhập lại mật khẩu mới" required>
        </div>
        <button type="button" class="btn btn-primary" id="changePass">Đổi mật khẩu</button>
    </form>
    <hr/>
    <h3>Tin tức:</h3>
    <div class="notification">
        <div class="toast fade show" th:each="item: ${notification}">
            <div class="toast-header">
                <strong class="mr-auto"><i class="fa fa-exclamation-triangle" th:utext="| ${item.title}|"></i></strong>
                <small class="text-muted" th:utext="${item.startDate}"></small>
                <button type="button" class="ml-2 mb-1 close" data-dismiss="toast">&times;</button>
            </div>
            <div class="toast-body" th:utext="${item.content}">This is a basic toast message.</div>
        </div>
    </div>
</div>
</body>

<script>
    $("#changePass").click(function () {
        changePass();
    });

    function changePass() {
        var newPassword      = $("#newPass").val();
        var reNewPassword        = $("#reNewPass").val();
        if(newPassword == null || newPassword.trim() == "") {
            alert("Vui lòng nhập mật khẩu mới!");
            return;
        }
        if(reNewPassword == null || reNewPassword.trim() == "") {
            alert("Vui lòng nhập lại mật khẩu mới!");
            return;
        }
        if(newPassword != reNewPassword) {
            alert("Hai mật khẩu không khớp");
            return;
        }
        var dataCharge = {newPassword : newPassword, reNewPassword : reNewPassword};
        $.ajax({
            url: "/api/user/changePassword",
            type: "POST",
            dataType: 'json', headers: {
                'Authorization': sessionStorage.getItem("token"),
            },
            contentType: "application/json",
            data: JSON.stringify(dataCharge) ,
            success: function (response) {
                alert(response.msg);
                window.location.href = "/home";
            },
            error: function(jqXHR) {
                alert("Có lỗi xảy ra: "+ jqXHR.responseJSON.msg);
            }
        });
    }


    $("#getGiftDaily").click(function () {
        getGiftDaily();
    });

    function getGiftDaily() {
        var playerName      = $("#playerName").val();
        var serverId        = $("#serverId").val();
        if(playerName == null || playerName.trim() == "") {
            alert("Vui lòng nhập id nhân vật!");
            return;
        }
        if(serverId == 0) {
            alert("Chọn server trước!");
            return;
        }
        var dataCharge = {playerName : playerName, serverId : serverId};
        $.ajax({
            url: "/api/gift-code/daily",
            type: "POST",
            dataType: 'json', headers: {
                'Authorization': sessionStorage.getItem("token"),
            },
            contentType: "application/json",
            data: JSON.stringify(dataCharge) ,
            success: function (response) {
                alert(response.msg);
                window.location.href = "/home";
            },
            error: function(jqXHR) {
                alert("Có lỗi xảy ra: "+ jqXHR.responseJSON.msg);
            }
        });
    }
</script>
</html>
